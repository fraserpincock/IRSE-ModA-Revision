<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Module A Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700&family=Overpass+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1013;
    --panel:#161B1F;
    --panel-raised:#1C2227;
    --border:#262D33;
    --text:#EDEFEF;
    --muted:#8A939B;
    --accent:#4FA69E;
    --accent-hover:#5FBDB4;
    --correct:#3E9463;
    --correct-bg:rgba(62,148,99,0.14);
    --incorrect:#C1483B;
    --incorrect-bg:rgba(193,72,59,0.14);
    --review:#C98A2C;
    --review-bg:rgba(201,138,44,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Source Sans 3', -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:16px 16px 28px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  .title{
    font-family:'Overpass', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.01em;
  }
  .title small{
    display:block;
    font-family:'Source Sans 3', sans-serif;
    font-weight:400;
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
  }
  .stats{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:flex-end;
    row-gap:6px;
  }
  .stat{
    text-align:right;
  }
  .stat .n{
    font-family:'Overpass Mono', monospace;
    font-size:17px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .stat .l{
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
  }

  .progress-track{
    height:3px;
    background:var(--border);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width 0.4s ease;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px 18px;
    margin-bottom:16px;
  }
  .q-meta{
    font-family:'Overpass Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
  }
  .q-meta .badge{
    color:var(--review);
  }
  .q-text{
    font-size:16.5px;
    line-height:1.5;
    font-weight:500;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .option{
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:6px;
    padding:13px 14px;
    display:flex;
    gap:11px;
    align-items:flex-start;
    text-align:left;
    font-family:inherit;
    font-size:14.5px;
    color:var(--text);
    cursor:pointer;
    line-height:1.4;
    transition:border-color 0.15s, background 0.15s;
  }
  .option:hover:not(:disabled){
    border-color:var(--accent);
  }
  .option:disabled{
    cursor:default;
  }
  .option .letter{
    font-family:'Overpass Mono', monospace;
    font-weight:600;
    color:var(--muted);
    flex-shrink:0;
  }
  .option.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
  }
  .option.correct .letter{ color:var(--correct); }
  .option.incorrect{
    border-color:var(--incorrect);
    background:var(--incorrect-bg);
  }
  .option.incorrect .letter{ color:var(--incorrect); }
  .option.dim{
    opacity:0.45;
  }
  .option.selected{
    border-color:var(--accent);
    background:rgba(79,166,158,0.14);
  }
  .option.missed{
    border-color:var(--review);
    background:var(--review-bg);
  }
  .option.missed .letter{ color:var(--review); }
  .submit-btn[disabled]{
    opacity:0.35;
    cursor:default;
  }

  .feedback{
    border-radius:6px;
    padding:15px 16px;
    margin-bottom:16px;
    border:1px solid var(--border);
    animation:rise 0.25s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .feedback.ok{ border-color:var(--correct); }
  .feedback.no{ border-color:var(--incorrect); }
  .verdict{
    font-family:'Overpass', sans-serif;
    font-weight:700;
    font-size:13px;
    margin-bottom:8px;
  }
  .feedback.ok .verdict{ color:var(--correct); }
  .feedback.no .verdict{ color:var(--incorrect); }
  .explanation{
    font-size:14px;
    line-height:1.55;
    color:var(--text);
    margin-bottom:10px;
  }
  .reference{
    font-family:'Overpass Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    padding-top:9px;
    border-top:1px solid var(--border);
  }

  .next-btn{
    background:var(--accent);
    color:#0D1013;
    border:none;
    border-radius:6px;
    padding:14px;
    font-family:'Overpass', sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    width:100%;
  }
  .next-btn:hover{ background:var(--accent-hover); }

  .footer-row{
    margin-top:auto;
    padding-top:22px;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    align-items:center;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    font-family:'Source Sans 3', sans-serif;
    cursor:pointer;
    padding:6px 0;
  }
  .link-btn:hover{ color:var(--text); }

  .panel-toggle{
    display:none;
  }
  .missed-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:16px;
    margin-bottom:16px;
  }
  .missed-panel h3{
    font-family:'Overpass', sans-serif;
    font-size:13px;
    margin:0 0 12px;
    font-weight:700;
  }
  .missed-item{
    font-size:13px;
    padding:9px 0;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .missed-item:first-child{ border-top:none; }
  .missed-item .wc{
    font-family:'Overpass Mono', monospace;
    color:var(--review);
    flex-shrink:0;
    font-size:12px;
  }
  .empty-note{
    font-size:13px;
    color:var(--muted);
  }
  .demo-note{
    font-size:11.5px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:16px;
    padding:10px 12px;
    border:1px dashed var(--border);
    border-radius:6px;
  }
  .filter-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13.5px;
    padding:8px 0;
    border-top:1px solid var(--border);
    cursor:pointer;
  }
  .filter-row:first-of-type{ border-top:none; }
  .filter-row input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:var(--accent);
    flex-shrink:0;
  }
  .filter-row .filter-label{
    flex:1;
  }
  .filter-count{
    font-family:'Overpass Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .filter-actions{
    display:flex;
    gap:16px;
    padding-top:12px;
    margin-top:4px;
    border-top:1px solid var(--border);
  }
  .filter-row.revisit-row{
    border-top:1px dashed var(--border);
    margin-top:6px;
    padding-top:14px;
  }
  .filter-row.revisit-row .filter-label{
    color:var(--review);
    font-weight:600;
  }

  .bookmark-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:17px;
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  .bookmark-btn:hover{ color:var(--accent); }
  .bookmark-btn.active{ color:var(--review); }

  .stats-row{
    padding:10px 0;
    border-top:1px solid var(--border);
  }
  .stats-row:first-child{ border-top:none; }
  .stats-row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    font-size:13px;
    margin-bottom:6px;
  }
  .stats-row-top .cat-name{ font-weight:600; }
  .stats-row-top .cat-count{
    font-family:'Overpass Mono', monospace;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
    flex-shrink:0;
  }
  .stats-bar-track{
    height:5px;
    background:var(--border);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .stats-bar-fill{
    height:100%;
    background:var(--muted);
  }
  .stats-row.weak .stats-bar-fill{ background:var(--incorrect); }
  .stats-row.mid .stats-bar-fill{ background:var(--review); }
  .stats-row.strong .stats-bar-fill{ background:var(--correct); }
  .acc-label{
    font-family:'Overpass Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .acc-label.weak{ color:var(--incorrect); }
  .acc-label.mid{ color:var(--review); }
  .acc-label.strong{ color:var(--correct); }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ============================================================
// NEW 300-QUESTION BANK — replaces the original 620-question bank.
// Same 21 topics, proportionally scaled (620 -> 300, ~48.4%).
// Each topic array is generated fresh from the same source article(s)
// as the original bank, with harder questions and decoys matched in
// length/detail to the correct answer.
// ============================================================

// Source: "Functional safety requirements for train control systems" (IRSE News 259, Oct 2019)
const REQS_QUESTIONS = [
  {
    id: "reqs_01",
    topic: "Sectional route release",
    q: "What is the purpose of 'sectional route release' as described in the article?",
    options: [
      "To release the entire section of line only once the whole train has passed completely clear of it, to simplify route setting",
      "To release parts of a section of line progressively as the train passes clear, allowing other routes to be set earlier",
      "To release the section immediately once the movement authority is issued, before the train enters it, to speed up junction clearing",
      "To release the section based on a fixed timer after signal clearance, regardless of the train's actual position"
    ],
    correct: 1,
    explanation: "Sectional route release progressively releases parts of a section of line as the train passes clear, allowing other routes to be set earlier, rather than waiting for the whole train to clear the entire section.",
    reference: "Security of the line"
  },
  {
    id: "reqs_02",
    topic: "Security of the line",
    q: "Once authority to move has been rescinded but the train has not yet reached the danger point, what must be true before the security of that section of line can be considered no longer required?",
    options: [
      "The train must have already entered the section and be travelling below the maximum permitted speed for that section",
      "The signaller must have visually confirmed the train has stopped using trackside CCTV coverage of the section",
      "The rescission must have been communicated to the train, which must have sufficient space to come to a stand safely before the start of the section",
      "The train must have completed at least half of its braking distance calculated from its recorded speed at the point of rescission"
    ],
    correct: 2,
    explanation: "Security is only no longer required once the rescission has been communicated to the train and the train has sufficient space to come to a stand safely before the start of the section over which authority was given.",
    reference: "Security of the line"
  },
  {
    id: "reqs_03",
    topic: "Definition of 'secure'",
    q: "How does the article define the 'security' of a section of line?",
    options: [
      "A comprehensive guarantee that the line is entirely free of obstructions, has a correct gauge, and is physically stable, verified independently of train detection",
      "A limited set of safety requirements primarily relating to the position and locking of points and the routing of other trains, not normally including proof the line is free of obstructions or physically stable",
      "A guarantee restricted solely to the correct locking of points, without any consideration of the routing or presence of other trains on the line",
      "A general term describing the overall reliability of the signalling system's hardware and software, unrelated to specific point or route conditions"
    ],
    correct: 1,
    explanation: "'Secure' refers to a limited set of safety requirements, primarily relating to the position and locking of points and the routing of other trains; it doesn't usually include proof the line is free of all obstructions or that the track is physically stable.",
    reference: "The term 'secure'"
  },
  {
    id: "reqs_04",
    topic: "Overrun/overspeed protection measures",
    q: "Which of the following is given as an example of a technical measure to prevent or mitigate a train exceeding its movement authority, overspeeding, or moving without authorisation?",
    options: [
      "Full-length platform screen doors with automatic selective door opening",
      "Axle counters and track circuits used to continuously verify train integrity along the route",
      "Trap points, approach control or release of signals, and flank protection",
      "Cab-based moving-block transponders that recalculate braking curves every 200 milliseconds"
    ],
    correct: 2,
    explanation: "The article lists overlaps, train protection/warning systems, flank protection, approach control/release of signals, trap points and speed signs as examples of technical solutions to prevent or mitigate these risks.",
    reference: "Control measures for movement authority, speed and unauthorised movement"
  },
  {
    id: "reqs_05",
    topic: "Human intervention in degraded modes",
    q: "What does the article say about relying on human intervention (e.g. a signaller authorising a train past a signal at danger) to recover from a degraded mode?",
    options: [
      "It is generally preferred over automated recovery because it provides greater flexibility",
      "It carries no additional risk compared with automatic recovery, provided operators are properly trained and assessed",
      "It should be avoided entirely, with systems designed to have no manual recovery mechanism at all",
      "It entails significantly higher risk and is therefore not the preferred means of achieving system availability"
    ],
    correct: 3,
    explanation: "The article states that human intervention such as signallers authorising trains past signals at danger entails significantly higher risk and is therefore not the preferred means of meeting availability requirements.",
    reference: "Degraded modes of operation"
  }
];

// Source: "Back to basics: SIL explained" (Paul Darlington & Ian Mitchell, IRSE News Issue 292, October 2022)
const SILEXPLAINED_QUESTIONS = [
  {
    id: "sil2_01",
    topic: "Software failures vs MTBWSF",
    q: "Why can't software failure rates be predicted from observed data in the same way hardware random failure rates can (via MTBWSF)?",
    options: [
      "Software failures occur far more frequently than hardware failures, making any calculated figure statistically insignificant",
      "Software failures are systematic rather than random — repeating the same circumstances gives the same result, so a small change in operating conditions can reveal or hide a latent defect",
      "Software components lack the duplicated or triplicated architectures used for hardware, so no meaningful reliability figure can be produced",
      "Software failure rates can only be measured after an accident has occurred, making predictive calculation impossible in principle"
    ],
    correct: 1,
    explanation: "Software failures are systematic, not random — the same circumstances always give the same result — so a small change in operating conditions can reveal or hide a latent defect, making prediction from observed failure rates futile.",
    reference: "Back to basics: SIL explained — introduction"
  },
  {
    id: "sil2_02",
    topic: "Origin of SIL",
    q: "Where did the SIL concept originate, and how do the railway-specific standards relate to it?",
    options: [
      "EN 50129, a rail-specific CENELEC standard, from which the more general IEC 61508 was later derived for other industries",
      "IEC 61508, developed specifically for railway signalling, later adapted by CENELEC into EN 50126 for aerospace and automotive use",
      "IEC 61508, a non-rail-specific functional safety standard, from which CENELEC derived rail-specific standards including EN 50126, EN 50128 and EN 50129",
      "EN 50128, a software-specific CENELEC standard that was the original source from which IEC 61508 and EN 50129 were later developed"
    ],
    correct: 2,
    explanation: "SIL originates from IEC 61508, a non-rail-specific functional safety standard, from which CENELEC derived rail-specific standards including EN 50126 (RAMS), EN 50128 (software) and EN 50129 (safety-related electronic systems).",
    reference: "Back to basics: SIL explained — standards"
  },
  {
    id: "sil2_03",
    topic: "Common misconception about SIL",
    q: "What is the common misconception about SIL that the article specifically warns against?",
    options: [
      "That SIL levels can only be assigned to entire signalling systems, never to individual safety functions within a larger system",
      "That an individual product or component can itself carry a SIL rating, when in fact SIL applies to safety functions and systems, not to standalone products",
      "That a product's SIL rating is determined solely by its measured Mean Time Between Wrong Side Failure, regardless of implementation",
      "That achieving a higher SIL always requires replacing hardware rather than improving the design and validation process"
    ],
    correct: 1,
    explanation: "A common misconception is that individual products or components carry a SIL rating; in reality SIL applies to safety functions and systems, and a component is only suitable for use within a correctly implemented SIL system.",
    reference: "Back to basics: SIL explained — common misconceptions"
  },
  {
    id: "sil2_04",
    topic: "Reliability vs safety",
    q: "Why might a safety system have a lower overall mean time between failures than an equivalent non-safety system doing a similar job?",
    options: [
      "Safety systems are deliberately built from lower-grade components to make failures easier to detect and diagnose",
      "Achieving a high SIL rating always requires reducing the redundancy built into the system, raising the overall failure rate",
      "A safety system may fail more often in non-dangerous, fail-safe ways, so it can reliably perform its safety function while still having a lower overall MTBF",
      "Safety systems are tested far less frequently than non-safety systems, so latent defects remain undetected for longer"
    ],
    correct: 2,
    explanation: "A safety system may fail more frequently in ways considered not dangerous (fail-safe); it can therefore reliably perform its safety function while having a lower overall MTBF than a non-safety system doing a similar job.",
    reference: "Back to basics: SIL explained — availability and reliability"
  },
  {
    id: "sil2_05",
    topic: "Cost of over-specifying SIL",
    q: "Why does the article caution against specifying a higher SIL than a risk assessment actually requires?",
    options: [
      "International standards prohibit specifying above SIL 2 for any system that doesn't directly control train movements",
      "Whole-life costs rise considerably with higher SIL, and the added design/testing/maintenance rigour can reduce overall performance reliability and hinder future enhancements",
      "A higher SIL rating automatically voids the manufacturer's warranty on programmable electronic components",
      "Specifying a higher SIL always requires triplicated hardware architectures regardless of the actual risk involved"
    ],
    correct: 1,
    explanation: "Whole life costs are considerably higher for higher SIL levels; the added rigour of design, testing and maintenance is complicated, time-consuming and expensive, can reduce overall performance reliability, and can obstruct future enhancements.",
    reference: "Back to basics: SIL explained — selecting the appropriate SIL"
  }
];

// Source: "Back to basics: Telecoms" Parts 1 & 2 (Paul Darlington & Trevor
// Foulkes, IRSE News #270 Oct 2020 & #271 Nov 2020)
const TELECOMS_QUESTIONS = [
  {
    id: "tel_01",
    topic: "Lineside telephones",
    q: "Why do lineside telephones at level crossings typically use Central Battery (CB) working over a twisted copper pair?",
    options: [
      "So that multiple crossings can share one telephone number using multi-frequency tone dialling over a single pair",
      "So that no local power supply is needed at the telephone location, since it is powered directly over the copper circuit at around 50V DC",
      "So that the telephone can automatically detect an approaching train using loop current changes caused by the rails",
      "So that the signaller can distinguish between different crossings using a distinctive AC ringing cadence rather than DC current"
    ],
    correct: 1,
    explanation: "Lineside telephones are normally powered over the copper circuit at around 50V DC (Central Battery working), so no separate power supply is needed at the telephone location itself.",
    reference: "Telecoms Part 1 — Voice communications by telephone"
  },
  {
    id: "tel_02",
    topic: "Copper cable",
    q: "Why can telecoms copper cables be used to carry DC signalling circuits, but signalling cables cannot generally be used the other way round to carry telecoms circuits?",
    options: [
      "Telecoms cables have a much lower insulation resistance than signalling cables, making shared use of telecoms cable safer",
      "Signalling cables are always steel-armoured, which blocks the audio frequencies telecoms circuits need to operate",
      "Telecoms cables are constructed with twisted pairs suitable for speech and data use, whereas signalling cables are built only for DC and lack this construction",
      "Telecoms cables cannot carry any DC current at all, so an isolation transformer would always be required first"
    ],
    correct: 2,
    explanation: "Telecoms cables use twisted-pair construction (to reduce crosstalk) and high insulation resistance, so they can carry DC signalling circuits; conventional signalling cables are built only for DC and are not constructed with twisted pairs, so the reverse doesn't work.",
    reference: "Telecoms Part 1 — Copper cable"
  },
  {
    id: "tel_03",
    topic: "GSM-R emergency calls",
    q: "Why is careful design of frequency allocation and neighbour lists particularly important for a railway emergency call, compared with an ordinary public mobile call?",
    options: [
      "Because public mobile networks use a completely different modulation scheme, requiring real-time conversion by railway equipment",
      "Because GSM-R networks are restricted to a single shared frequency across the whole national network, unlike public systems",
      "Because emergency calls must always be routed to the nearest signal box by distance, regardless of which base station the train is using",
      "Because an emergency call must be routed to the signaller controlling the section the train had selected before the call, so which base station a train is registered to must be reliably known"
    ],
    correct: 3,
    explanation: "Unlike a public network, where it doesn't matter which base station handles a call, a GSM-R emergency call must reach the correct controlling signaller, so cell reselection, frequency allocation and neighbour lists need careful design.",
    reference: "Telecoms Part 1 — Voice communication by radio"
  },
  {
    id: "tel_04",
    topic: "Radio in tunnels",
    q: "What advantage does a leaky feeder (radiating cable) have over free-space antenna propagation for radio coverage in a tunnel?",
    options: [
      "It removes the need for any handover between base stations for the entire length of the tunnel",
      "It increases the maximum achievable data rate compared with any free-space antenna system in a double-track tunnel",
      "It provides a consistent, generally predictable level of attenuation along the tunnel that is not significantly affected by passing trains",
      "It eliminates the additional attenuation caused by bends in the tunnel or by the tunnel lining material"
    ],
    correct: 2,
    explanation: "A leaky feeder's attenuation is consistent and predictable along its length and, unlike free-space propagation, is not affected by trains passing through the tunnel.",
    reference: "Telecoms Part 1 — Voice communication by radio"
  },
  {
    id: "tel_05",
    topic: "PDH/SDH transmission",
    q: "In a PDH/SDH primary multiplexer's E1 data stream, what are timeslot 0 and timeslot 16 used for, and what are the remaining timeslots used for?",
    options: [
      "Timeslot 0 carries a supervisory speech channel, timeslot 16 is reserved for ETCS data, and the remaining timeslots carry SCADA telemetry only",
      "Timeslot 0 carries synchronisation and alarms, timeslot 16 is normally used for channel-associated signalling, and the remaining 30 timeslots each carry a 64kbit/s speech or data circuit",
      "Timeslot 0 carries the destination address for routing, timeslot 16 carries the source address, and the remaining timeslots each carry a fixed 2Mbit/s circuit",
      "Timeslot 0 carries the highest-priority speech circuit, timeslot 16 carries the lowest-priority circuit, and the remaining timeslots are shared equally between speech and data"
    ],
    correct: 1,
    explanation: "Of the 32 timeslots in an E1 stream, timeslot 0 is for synchronisation and alarms, timeslot 16 is normally used for channel-associated signalling, and the other 30 timeslots each carry a 64kbit/s speech or data circuit.",
    reference: "Telecoms Part 1 — Primary layers and primary multiplexers"
  },
  {
    id: "tel_06",
    topic: "IP vs circuit switching",
    q: "Why does the article describe packet-switched IP networking as more efficient than PDH/SDH circuit switching?",
    options: [
      "Packet-switched networks always use higher-bandwidth fibre, so overall speeds are inherently faster regardless of demand",

// Real topics plus the virtual "to be revisited" filter, for the Topics panel.
function filterableCategories(){
  return [...allCategories(), REVISIT_CATEGORY];
}
function needsRevisit(q){
  const p = progress[q.id];
  return !!p && (p.bookmarked || p.wrong > 0);
}
function loadFilter(){
  try{
    const raw = localStorage.getItem(FILTER_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      const validSet = new Set(filterableCategories());
      const valid = arr.filter(c => validSet.has(c));
      if(valid.length) return new Set(valid);
    }
  }catch(e){}
  return new Set(allCategories()); // default: every real topic selected, revisit off
}
function saveFilter(set){
  try{ localStorage.setItem(FILTER_KEY, JSON.stringify([...set])); }catch(e){}
}
function filteredQuestions(){
  return QUESTIONS.filter(q => {
    if(selectedCategories.has(q.category)) return true;
    if(selectedCategories.has(REVISIT_CATEGORY) && needsRevisit(q)) return true;
    return false;
  });
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const fresh = {};
  QUESTIONS.forEach(q => fresh[q.id] = freshProgress());
  return fresh;
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}

let progress = loadProgress();
QUESTIONS.forEach(q => {
  if(!progress[q.id]){
    progress[q.id] = freshProgress();
  } else {
    // Migrate any progress saved by an older version of this app.
    const p = progress[q.id];
    if(p.bookmarked === undefined) p.bookmarked = false;
    if(p.lastResult === undefined) p.lastResult = null;
  }
});

let sessionCorrect = 0;
let sessionSeen = 0;
let queue = [];
let currentQ = null;
let answered = false;
let showingFilter = false;
let showingStats = false;
let showingBookmarks = false;
let selectedSet = new Set();
let selectedCategories = loadFilter();
let lastSelectedIdx = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function bookmarkedQuestions(){
  return QUESTIONS.filter(q => progress[q.id] && progress[q.id].bookmarked);
}
function coverageCount(){
  return QUESTIONS.filter(q => progress[q.id] && progress[q.id].seen > 0).length;
}
function topicStats(){
  return allCategories().map(cat => {
    const qs = QUESTIONS.filter(q => q.category === cat);
    let attempted = 0, seenTotal = 0, wrongTotal = 0;
    qs.forEach(q => {
      const p = progress[q.id];
      if(p && p.seen > 0){
        attempted++;
        seenTotal += p.seen;
        wrongTotal += p.wrong;
      }
    });
    const accuracy = seenTotal > 0 ? Math.round(((seenTotal - wrongTotal) / seenTotal) * 100) : null;
    return { cat, attempted, total: qs.length, accuracy };
  });
}

// Returns a copy of the question with its options in a random order, so the
// correct answer isn't always in the same position. Works for both single
// (correct: number) and multi (correct: array) formats.
function withShuffledOptions(q){
  const order = shuffle(q.options.map((_, i) => i)); // random permutation of original indices
  const newOptions = order.map(origIdx => q.options[origIdx]);
  let newCorrect;
  if(Array.isArray(q.correct)){
    newCorrect = order
      .map((origIdx, newIdx) => q.correct.includes(origIdx) ? newIdx : -1)
      .filter(x => x !== -1);
  } else {
    newCorrect = order.indexOf(q.correct);
  }
  return Object.assign({}, q, { options: newOptions, correct: newCorrect });
}

// A full, shuffled pass through every currently-selected question. Because
// nextQuestion() only rebuilds this once it's empty, you always see every
// question in the pool once before anything repeats.
function buildQueue(){
  return shuffle(filteredQuestions().map(q => q.id));
}

function nextQuestion(){
  if(filteredQuestions().length === 0){
    currentQ = null;
    answered = false;
    selectedSet = new Set();
    lastSelectedIdx = null;
    render();
    return;
  }
  if(queue.length === 0) queue = buildQueue();
  const id = queue.shift();
  currentQ = withShuffledOptions(QUESTIONS.find(q => q.id === id));
  answered = false;
  selectedSet = new Set();
  lastSelectedIdx = null;
  sessionSeen++;
  render();
}

function recordAnswer(isCorrect){
  const p = progress[currentQ.id];
  p.seen++;
  p.lastResult = isCorrect ? 'correct' : 'incorrect';
  if(isCorrect){
    sessionCorrect++;
  } else {
    p.wrong++;
  }
  progress[currentQ.id] = p;
  saveProgress(progress);
  answered = true;
}

function selectOption(idx){
  if(answered) return;
  lastSelectedIdx = idx;
  const isCorrect = idx === currentQ.correct;
  recordAnswer(isCorrect);
  render(idx);
}

// Bookmarking is independent of correct/incorrect and works both before and
// after the question has been answered.
function toggleBookmark(){
  if(!currentQ) return;
  const p = progress[currentQ.id];
  p.bookmarked = !p.bookmarked;
  progress[currentQ.id] = p;
  saveProgress(progress);
  render(lastSelectedIdx);
}

function toggleOption(idx){
  if(answered) return;
  if(selectedSet.has(idx)){
    selectedSet.delete(idx);
  } else if(selectedSet.size < currentQ.selectCount){
    selectedSet.add(idx);
  }
  render();
}

function submitMulti(){
  if(answered) return;
  if(selectedSet.size !== currentQ.selectCount) return;
  const isCorrect = currentQ.correct.length === selectedSet.size &&
    currentQ.correct.every(x => selectedSet.has(x));
  recordAnswer(isCorrect);
  render();
}

function resetProgress(){
  if(!confirm('Reset all progress, including bookmarks and topic stats? This cannot be undone.')) return;
  progress = {};
  QUESTIONS.forEach(q => progress[q.id] = freshProgress());
  saveProgress(progress);
  sessionCorrect = 0;
  sessionSeen = 0;
  queue = [];
  showingStats = false;
  showingBookmarks = false;
  lastSelectedIdx = null;
  nextQuestion();
}

function toggleStatsPanel(){
  showingStats = !showingStats;
  render(lastSelectedIdx);
}

function toggleBookmarksPanel(){
  showingBookmarks = !showingBookmarks;
  render(lastSelectedIdx);
}

function applyFilterChange(){
  saveFilter(selectedCategories);
  queue = [];
  sessionCorrect = 0;
  sessionSeen = 0;
  nextQuestion();
}

function toggleCategory(cat){
  if(selectedCategories.has(cat)) selectedCategories.delete(cat);
  else selectedCategories.add(cat);
  applyFilterChange();
}

function selectAllCategories(){
  selectedCategories = new Set(filterableCategories());
  applyFilterChange();
}

function clearAllCategories(){
  selectedCategories = new Set();
  applyFilterChange();
}

function toggleFilterPanel(){
  showingFilter = !showingFilter;
  render(lastSelectedIdx);
}

// ---------- RENDER ----------
function render(selectedIdx = lastSelectedIdx){
  const app = document.getElementById('app');
  const isBookmarked = currentQ && !!progress[currentQ.id].bookmarked;
  const fmt = currentQ && currentQ.format === 'multi' ? 'multi' : 'single';

  let optionsHtml = '';
  let submitHtml = '';
  let correctNow = false;

  if(currentQ && fmt === 'single'){
    optionsHtml = currentQ.options.map((opt, i) => {
      let cls = 'option';
      let disabled = '';
      if(answered){
        disabled = 'disabled';
        if(i === currentQ.correct) cls += ' correct';
        else if(i === selectedIdx) cls += ' incorrect';
        else cls += ' dim';
      }
      const letter = String.fromCharCode(65+i);
      return `<button class="${cls}" ${disabled} onclick="selectOption(${i})">
        <span class="letter">${letter}</span><span>${opt}</span>
      </button>`;
    }).join('');
    correctNow = selectedIdx === currentQ.correct;
  } else if(currentQ && fmt === 'multi'){
    optionsHtml = currentQ.options.map((opt, i) => {
      let cls = 'option';
      let disabled = '';
      const isSelected = selectedSet.has(i);
      const isCorrectOpt = currentQ.correct.includes(i);
      if(answered){
        disabled = 'disabled';
        if(isSelected && isCorrectOpt) cls += ' correct';
        else if(isSelected && !isCorrectOpt) cls += ' incorrect';
        else if(!isSelected && isCorrectOpt) cls += ' missed';
        else cls += ' dim';
      } else if(isSelected){
        cls += ' selected';
      }
      const letter = String.fromCharCode(65+i);
      return `<button class="${cls}" ${disabled} onclick="toggleOption(${i})">
        <span class="letter">${letter}</span><span>${opt}</span>
      </button>`;
    }).join('');
    if(!answered){
      const canSubmit = selectedSet.size === currentQ.selectCount;
      submitHtml = `<button class="next-btn submit-btn" ${canSubmit ? '' : 'disabled'} onclick="submitMulti()">Check answer (${selectedSet.size}/${currentQ.selectCount} selected)</button>`;
    }
    correctNow = currentQ.correct.length === selectedSet.size && currentQ.correct.every(x => selectedSet.has(x));
  }

  let feedbackHtml = '';
  if(answered){
    feedbackHtml = `
      <div class="feedback ${correctNow ? 'ok' : 'no'}">
        <div class="verdict">${correctNow ? 'Correct' : 'Incorrect'}</div>
        <div class="explanation">${currentQ.explanation}</div>
        <div class="reference">${currentQ.reference}</div>
      </div>
      <button class="next-btn" onclick="nextQuestion()">Next question</button>
    `;
  }

  const bookmarks = bookmarkedQuestions();
  let bookmarksPanelHtml = '';
  if(showingBookmarks){
    if(bookmarks.length === 0){
      bookmarksPanelHtml = `<div class="missed-panel"><h3>Bookmarked questions</h3><div class="empty-note">No bookmarks yet — tap the star on a question to save it here.</div></div>`;
    } else {
      const items = bookmarks.map(q => `
        <div class="missed-item"><span>${q.category} — ${q.topic}: ${q.q}</span></div>
      `).join('');
      bookmarksPanelHtml = `<div class="missed-panel"><h3>Bookmarked questions (${bookmarks.length})</h3>${items}</div>`;
    }
  }

  let statsPanelHtml = '';
  if(showingStats){
    const sorted = topicStats().slice().sort((a, b) => {
      if(a.accuracy === null && b.accuracy === null) return 0;
      if(a.accuracy === null) return 1;
      if(b.accuracy === null) return -1;
      return a.accuracy - b.accuracy;
    });
    const weakest = sorted.filter(s => s.accuracy !== null && s.accuracy < 70).slice(0, 3);
    const covCount = coverageCount();
    const covPct = QUESTIONS.length ? Math.round((covCount / QUESTIONS.length) * 100) : 0;
    const rows = sorted.map(s => {
      let tier = 'unattempted';
      let label = 'Not started';
      if(s.accuracy !== null){
        label = s.accuracy + '% correct';
        tier = s.accuracy < 70 ? 'weak' : (s.accuracy < 90 ? 'mid' : 'strong');
      }
      return `<div class="stats-row ${tier}">
        <div class="stats-row-top">
          <span class="cat-name">${s.cat}</span>
          <span class="cat-count">${s.attempted}/${s.total} attempted</span>
        </div>
        <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${s.accuracy ?? 0}%"></div></div>
        <div class="acc-label ${tier}">${label}</div>
      </div>`;
    }).join('');
    const weakestLine = weakest.length
      ? `<div class="empty-note" style="margin-bottom:10px;">Weakest so far: ${weakest.map(w => `${w.cat} (${w.accuracy}%)`).join(', ')}</div>`
      : '';
    statsPanelHtml = `<div class="missed-panel">
      <h3>Topic breakdown</h3>
      <div class="empty-note" style="margin-bottom:10px;">Coverage: ${covCount}/${QUESTIONS.length} questions seen overall (${covPct}%)</div>
      ${weakestLine}
      ${rows}
    </div>`;
  }

  const cats = filterableCategories();
  let filterPanelHtml = '';
  if(showingFilter){
    const rows = cats.map(cat => {
      const isRevisit = cat === REVISIT_CATEGORY;
      const count = isRevisit ? QUESTIONS.filter(needsRevisit).length : QUESTIONS.filter(q => q.category === cat).length;
      const checked = selectedCategories.has(cat) ? 'checked' : '';
      const safeCat = cat.replace(/'/g, "\\'");
      return `<label class="filter-row ${isRevisit ? 'revisit-row' : ''}">
        <input type="checkbox" ${checked} onchange="toggleCategory('${safeCat}')">
        <span class="filter-label">${cat}</span>
        <span class="filter-count">${count}</span>
      </label>`;
    }).join('');
    filterPanelHtml = `<div class="missed-panel">
      <h3>Topics to practise</h3>
      ${rows}
      <div class="filter-actions">
        <button class="link-btn" onclick="selectAllCategories()">Select all</button>
        <button class="link-btn" onclick="clearAllCategories()">Clear all</button>
      </div>
    </div>`;
  }

  const pool = filteredQuestions();
  const realCats = allCategories();
  const selectedList = [...selectedCategories];
  const selectedRealTopics = selectedList.filter(c => c !== REVISIT_CATEGORY);
  const revisitOn = selectedCategories.has(REVISIT_CATEGORY);
  let statusText;
  if(selectedList.length === 0){
    statusText = "No topics selected — open Topics below and choose at least one to start practising.";
  } else if(selectedRealTopics.length === realCats.length && !revisitOn){
    statusText = `Practising all topics — ${pool.length} questions in the mix.`;
  } else {
    const parts = [];
    if(selectedRealTopics.length) parts.push(selectedRealTopics.join(', '));
    if(revisitOn) parts.push(REVISIT_CATEGORY);
    statusText = `Practising: ${parts.join(', ')} — ${pool.length} questions in the mix.`;
  }

  app.innerHTML = `
    <header>
      <div class="title">Module A Revision<small>Practice quiz</small></div>
      <div class="stats">
        <div class="stat">
          <div class="n">${sessionCorrect}/${sessionSeen}</div>
          <div class="l">this session</div>
        </div>
        <div class="stat">
          <div class="n">${coverageCount()}/${QUESTIONS.length}</div>
          <div class="l">seen overall</div>
        </div>
      </div>
    </header>

    <div class="demo-note">${statusText}</div>

    ${filterPanelHtml}

    ${statsPanelHtml}

    ${bookmarksPanelHtml}

    ${currentQ ? `
    <div class="card">
      <div class="q-meta">
        <span>${currentQ.category} — ${currentQ.topic}</span>
        <span style="display:flex; gap:10px; align-items:center;">
          ${fmt === 'multi' ? `<span class="badge" style="color:var(--accent);">select ${currentQ.selectCount}</span>` : ''}
          <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark()" title="${isBookmarked ? 'Remove bookmark' : 'Bookmark this question'}">${isBookmarked ? '\u2605' : '\u2606'}</button>
        </span>
      </div>
      <div class="q-text">${currentQ.q}</div>
    </div>
    <div class="options">${optionsHtml}</div>
    ${submitHtml}
    ${feedbackHtml}
    ` : `
    <div class="card">
      <div class="q-text">No questions to show for the current topic selection. Open Topics below and pick at least one to begin.</div>
    </div>
    `}

    <div class="footer-row">
      <button class="link-btn" onclick="toggleFilterPanel()">${showingFilter ? 'Hide topics' : 'Topics'}</button>
      <button class="link-btn" onclick="toggleStatsPanel()">${showingStats ? 'Hide stats' : 'Stats'}</button>
      <button class="link-btn" onclick="toggleBookmarksPanel()">${showingBookmarks ? 'Hide bookmarks' : `Bookmarks (${bookmarks.length})`}</button>
      <button class="link-btn" onclick="resetProgress()">Reset progress</button>
    </div>
  `;
}

nextQuestion();
</script>
</body>
</html>
