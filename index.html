<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Module A Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700&family=Overpass+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1013;
    --panel:#161B1F;
    --panel-raised:#1C2227;
    --border:#262D33;
    --text:#EDEFEF;
    --muted:#8A939B;
    --accent:#4FA69E;
    --accent-hover:#5FBDB4;
    --correct:#3E9463;
    --correct-bg:rgba(62,148,99,0.14);
    --incorrect:#C1483B;
    --incorrect-bg:rgba(193,72,59,0.14);
    --review:#C98A2C;
    --review-bg:rgba(201,138,44,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Source Sans 3', -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:16px 16px 28px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  .title{
    font-family:'Overpass', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.01em;
  }
  .title small{
    display:block;
    font-family:'Source Sans 3', sans-serif;
    font-weight:400;
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
  }
  .stats{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:flex-end;
    row-gap:6px;
  }
  .stat{
    text-align:right;
  }
  .stat .n{
    font-family:'Overpass Mono', monospace;
    font-size:17px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .stat .l{
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
  }
  .stat.due .n{ color:var(--review); }

  .progress-track{
    height:3px;
    background:var(--border);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width 0.4s ease;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px 18px;
    margin-bottom:16px;
  }
  .card.review-tag{
    border-left:3px solid var(--review);
  }
  .q-meta{
    font-family:'Overpass Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
  }
  .q-meta .badge{
    color:var(--review);
  }
  .q-text{
    font-size:16.5px;
    line-height:1.5;
    font-weight:500;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .option{
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:6px;
    padding:13px 14px;
    display:flex;
    gap:11px;
    align-items:flex-start;
    text-align:left;
    font-family:inherit;
    font-size:14.5px;
    color:var(--text);
    cursor:pointer;
    line-height:1.4;
    transition:border-color 0.15s, background 0.15s;
  }
  .option:hover:not(:disabled){
    border-color:var(--accent);
  }
  .option:disabled{
    cursor:default;
  }
  .option .letter{
    font-family:'Overpass Mono', monospace;
    font-weight:600;
    color:var(--muted);
    flex-shrink:0;
  }
  .option.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
  }
  .option.correct .letter{ color:var(--correct); }
  .option.incorrect{
    border-color:var(--incorrect);
    background:var(--incorrect-bg);
  }
  .option.incorrect .letter{ color:var(--incorrect); }
  .option.dim{
    opacity:0.45;
  }
  .option.selected{
    border-color:var(--accent);
    background:rgba(79,166,158,0.14);
  }
  .option.missed{
    border-color:var(--review);
    background:var(--review-bg);
  }
  .option.missed .letter{ color:var(--review); }
  .submit-btn[disabled]{
    opacity:0.35;
    cursor:default;
  }

  .feedback{
    border-radius:6px;
    padding:15px 16px;
    margin-bottom:16px;
    border:1px solid var(--border);
    animation:rise 0.25s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .feedback.ok{ border-color:var(--correct); }
  .feedback.no{ border-color:var(--incorrect); }
  .verdict{
    font-family:'Overpass', sans-serif;
    font-weight:700;
    font-size:13px;
    margin-bottom:8px;
  }
  .feedback.ok .verdict{ color:var(--correct); }
  .feedback.no .verdict{ color:var(--incorrect); }
  .explanation{
    font-size:14px;
    line-height:1.55;
    color:var(--text);
    margin-bottom:10px;
  }
  .reference{
    font-family:'Overpass Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    padding-top:9px;
    border-top:1px solid var(--border);
  }

  .next-btn{
    background:var(--accent);
    color:#0D1013;
    border:none;
    border-radius:6px;
    padding:14px;
    font-family:'Overpass', sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    width:100%;
  }
  .next-btn:hover{ background:var(--accent-hover); }

  .footer-row{
    margin-top:auto;
    padding-top:22px;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    align-items:center;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    font-family:'Source Sans 3', sans-serif;
    cursor:pointer;
    padding:6px 0;
  }
  .link-btn:hover{ color:var(--text); }

  .panel-toggle{
    display:none;
  }
  .missed-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:16px;
    margin-bottom:16px;
  }
  .missed-panel h3{
    font-family:'Overpass', sans-serif;
    font-size:13px;
    margin:0 0 12px;
    font-weight:700;
  }
  .missed-item{
    font-size:13px;
    padding:9px 0;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .missed-item:first-child{ border-top:none; }
  .missed-item .wc{
    font-family:'Overpass Mono', monospace;
    color:var(--review);
    flex-shrink:0;
    font-size:12px;
  }
  .empty-note{
    font-size:13px;
    color:var(--muted);
  }
  .demo-note{
    font-size:11.5px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:16px;
    padding:10px 12px;
    border:1px dashed var(--border);
    border-radius:6px;
  }
  .filter-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13.5px;
    padding:8px 0;
    border-top:1px solid var(--border);
    cursor:pointer;
  }
  .filter-row:first-of-type{ border-top:none; }
  .filter-row input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:var(--accent);
    flex-shrink:0;
  }
  .filter-row .filter-label{
    flex:1;
  }
  .filter-count{
    font-family:'Overpass Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .filter-actions{
    display:flex;
    gap:16px;
    padding-top:12px;
    margin-top:4px;
    border-top:1px solid var(--border);
  }
  .filter-row.revisit-row{
    border-top:1px dashed var(--border);
    margin-top:6px;
    padding-top:14px;
  }
  .filter-row.revisit-row .filter-label{
    color:var(--review);
    font-weight:600;
  }

  .bookmark-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:17px;
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  .bookmark-btn:hover{ color:var(--accent); }
  .bookmark-btn.active{ color:var(--review); }

  .stats-row{
    padding:10px 0;
    border-top:1px solid var(--border);
  }
  .stats-row:first-child{ border-top:none; }
  .stats-row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    font-size:13px;
    margin-bottom:6px;
  }
  .stats-row-top .cat-name{ font-weight:600; }
  .stats-row-top .cat-count{
    font-family:'Overpass Mono', monospace;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
    flex-shrink:0;
  }
  .stats-bar-track{
    height:5px;
    background:var(--border);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .stats-bar-fill{
    height:100%;
    background:var(--muted);
  }
  .stats-row.weak .stats-bar-fill{ background:var(--incorrect); }
  .stats-row.mid .stats-bar-fill{ background:var(--review); }
  .stats-row.strong .stats-bar-fill{ background:var(--correct); }
  .acc-label{
    font-family:'Overpass Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .acc-label.weak{ color:var(--incorrect); }
  .acc-label.mid{ color:var(--review); }
  .acc-label.strong{ color:var(--correct); }
</style>
</head>

<div class="app" id="app"></div>

<script>
// ---------- QUESTION BANK: BATCH 1 — TELECOMS ----------
// Generated from: "Back to Basics: Telecoms Part 1" (IRSE News #270, Oct 2020)
// and "Back to Basics: Telecoms Part 2" (IRSE News #271, Nov 2020).
// Written in original wording — not copied from the source article.
const TELECOMS_QUESTIONS = [
  {
    id: "tc_p1_01",
    topic: "Operational telecoms",
    q: "Which of the following is NOT one of the four roles of operational telecoms described for a railway?",
    options: [
      "Facilitating normal day-to-day voice and data communications, including support for signalling and electrification",
      "Facilitating quick communications in the event of a problem or hazard",
      "Providing commercial passenger internet access as the primary purpose of the network",
      "Providing bearer services so other systems can communicate where and when required"
    ],
    correct: 2,
    explanation: "The article sets out four operational roles: day-to-day voice/data support (including signalling and electrification), rapid communication during a hazard, communication for those attending an accident, and bearer services for other systems. Passenger internet is a separate, secondary use, not one of these four.",
    reference: "Back to Basics: Telecoms Part 1 — \"Role of operational telecoms\""
  },
  {
    id: "tc_p1_02",
    topic: "Voice protocol",
    q: "Why do railways typically require an operational instruction given by radio or phone to be read back by the receiver?",
    options: [
      "To satisfy data protection legislation",
      "To reduce the load on the voice channel",
      "To confirm the instruction has been correctly understood, since a misinterpretation could lead to a hazardous situation",
      "To automatically log the caller's GPS location"
    ],
    correct: 2,
    explanation: "A voice protocol requiring messages to be repeated back exists because an incorrect understanding of an operational message can lead to the wrong action being taken, potentially creating a hazard.",
    reference: "Back to Basics: Telecoms Part 1 — \"Role of operational telecoms\""
  },
  {
    id: "tc_p1_03",
    topic: "Lineside telephones",
    q: "How is a typical analogue lineside telephone normally powered?",
    options: [
      "By a local battery housed in the telephone case",
      "Over the copper pair itself, at around 50V DC, known as Central Battery working",
      "By a dedicated mains supply run to every telephone location",
      "By induction from the nearby traction current"
    ],
    correct: 1,
    explanation: "Lineside telephones are normally powered over the copper circuit from the far end at roughly 50V DC — referred to as Central Battery (CB) working — so no local power source is needed at the phone itself.",
    reference: "Back to Basics: Telecoms Part 1 — \"Voice communications by telephone\""
  },
  {
    id: "tc_p1_04",
    topic: "Copper cable",
    q: "Which statement correctly describes the relationship between telecoms and signalling copper cables?",
    options: [
      "A telecoms cable can be used to carry DC signalling circuits, but a conventional signalling cable is not built to carry telecoms circuits",
      "The two cable types are fully interchangeable, since both use twisted pairs",
      "Signalling cables require a higher insulation resistance than telecoms cables",
      "Telecoms cables cannot be used for any signalling-related purpose"
    ],
    correct: 0,
    explanation: "Telecoms cables use twisted pairs and can carry DC signalling circuits, but conventional signalling cables are designed only for DC and lack the twisted-pair construction telecoms circuits need — so the reverse isn't true. Telecoms cable also needs a much higher insulation resistance (several megohms) than a DC signalling circuit requires.",
    reference: "Back to Basics: Telecoms Part 1 — \"Copper cable\""
  },
  {
    id: "tc_p1_05",
    topic: "Fibre cables",
    q: "Which two tools are described as essential for installing and fault-finding on fibre optic cable?",
    options: [
      "A crimping tool and a multimeter",
      "A fusion splicer and an Optical Time Domain Reflectometer (OTDR)",
      "A patch panel and a spectrum analyser",
      "A cable jointer and an insulation resistance tester"
    ],
    correct: 1,
    explanation: "A fusion splicer heats and welds two fibre ends together, while an OTDR sends light pulses down the fibre and measures the reflections to locate joints, poor connections, or breaks.",
    reference: "Back to Basics: Telecoms Part 1 — \"Fibre cables\""
  },
  {
    id: "tc_p1_06",
    topic: "Concentrators",
    q: "What is the main function of a \"concentrator\" at a signal box?",
    options: [
      "It amplifies the electrical power delivered to lineside telephone circuits",
      "It provides the operator interface through which the signaller answers and originates calls to lineside phones and other connected lines",
      "It converts UHF radio traffic into a GSM-R data stream",
      "It stores CCTV footage for the station"
    ],
    correct: 1,
    explanation: "The concentrator is the signaller's interface to all the connected phone lines — it shows which line is calling and lets the signaller answer or originate a call by selecting the relevant line.",
    reference: "Back to Basics: Telecoms Part 1 — \"Concentrators\""
  },
  {
    id: "tc_p1_07",
    topic: "UHF radio",
    q: "Which of these best describes UHF radios as typically used for railway station management and shunting?",
    options: [
      "Full duplex, allowing simultaneous talking and listening",
      "Normally simplex, so the user presses a button to talk and releases it to listen",
      "Restricted exclusively to the GSM-R frequency bands",
      "Licence-exempt because of their short range"
    ],
    correct: 1,
    explanation: "UHF radios used for station management, shunting, and engineering work are normally simplex, requiring a press-to-talk button, and are subject to strict voice protocol as a licence condition.",
    reference: "Back to Basics: Telecoms Part 1 — \"Voice communication by radio\""
  },
  {
    id: "tc_p1_08",
    topic: "GSM-R",
    q: "What does \"REC\" refer to as an enhanced facility on a GSM-R network?",
    options: [
      "Radio Emergency Coverage, a tunnel signal-strength measurement",
      "Railway Emergency Call, allowing rapid alerting of trains in a hazardous situation",
      "Remote Equipment Control, used for SCADA monitoring",
      "Recorded Evidence Channel, used for accident investigation"
    ],
    correct: 1,
    explanation: "REC (Railway Emergency Call) is one of the enhanced facilities GSM-R adds on top of the standard 2G platform, alongside call prioritisation, location- and function-dependent addressing, group calls, and data services.",
    reference: "Back to Basics: Telecoms Part 1 — \"Voice communication by radio\""
  },
  {
    id: "tc_p1_09",
    topic: "GSM-R",
    q: "What are the uplink and downlink frequency bands harmonised for GSM-R across Europe?",
    options: [
      "Uplink 876–880MHz, downlink 921–925MHz",
      "Uplink 900MHz, downlink 1800MHz, shared with public GSM",
      "Uplink 450MHz, downlink 900MHz",
      "Uplink 2.4GHz, downlink 5GHz"
    ],
    correct: 0,
    explanation: "GSM-R has dedicated, harmonised spectrum across Europe: 876–880MHz for uplink (mobile transmission) and 921–925MHz for downlink (mobile reception), with only 19 frequencies available in total.",
    reference: "Back to Basics: Telecoms Part 1 — \"Voice communication by radio\", Figure 1"
  },
  {
    id: "tc_p1_10",
    topic: "Radio in tunnels",
    q: "Why might a leaky feeder (radiating cable) be chosen over free-space antenna propagation for radio coverage inside a tunnel?",
    options: [
      "It is always cheaper to install per metre than any antenna solution",
      "It gives a consistent, predictable level of attenuation that isn't disturbed by passing trains",
      "It removes the need for any base stations along the route",
      "It automatically boosts available bandwidth as more trains enter the tunnel"
    ],
    correct: 1,
    explanation: "A leaky feeder radiates signal along its whole length through gaps in its outer conductor, giving predictable, consistent attenuation — unlike free-space propagation, which can be significantly disturbed by a train occupying the tunnel.",
    reference: "Back to Basics: Telecoms Part 1 — tunnel radio coverage section"
  },
  {
    id: "tc_p1_11",
    topic: "Transmission (E1/PMux)",
    q: "In a Primary Multiplexer (PMux) using a 2Mbit/s E1 data stream, how many timeslots does the stream contain, and what is timeslot 0 normally used for?",
    options: [
      "24 timeslots; timeslot 0 carries only speech",
      "32 timeslots; timeslot 0 is used for synchronisation and alarms",
      "8 timeslots; timeslot 0 is reserved for ETCS data",
      "64 timeslots; timeslot 0 is unused"
    ],
    correct: 1,
    explanation: "An E1 stream has 32 timeslots. Timeslot 0 carries synchronisation and alarm information, timeslot 16 is normally used for channel-associated signalling, and the remaining 30 timeslots (64kbit/s each) carry speech or data.",
    reference: "Back to Basics: Telecoms Part 1 — \"Primary layers and primary multiplexers\""
  },
  {
    id: "tc_p1_12",
    topic: "IP networking",
    q: "Why would a live voice call on a railway IP network typically use UDP rather than TCP?",
    options: [
      "UDP guarantees delivery of every packet, which voice quality requires",
      "UDP tolerates small gaps in delivery and doesn't request retransmission, which suits time-critical traffic",
      "UDP always provides more bandwidth than TCP",
      "UDP encrypts the payload by default, unlike TCP"
    ],
    correct: 1,
    explanation: "Voice and video are time-critical but can tolerate small gaps without the listener noticing, so UDP is used: it assembles packets in order but simply discards anything missing or corrupt rather than requesting retransmission, which TCP does for applications like email where every byte must arrive intact.",
    reference: "Back to Basics: Telecoms Part 1 — \"Internet Protocol (IP) networks\""
  },
  {
    id: "tc_p1_13",
    topic: "MPLS",
    q: "What capability does Multi-Protocol Label Switching (MPLS) add on top of a standard IP network?",
    options: [
      "It removes the need for routers entirely",
      "It provides guaranteed Quality of Service and VPN capability by making the connectionless IP network connection-orientated",
      "It automatically converts all traffic into TCP packets",
      "It removes the need for an IP header on each packet"
    ],
    correct: 1,
    explanation: "MPLS attaches a label to each packet to establish a virtual path, giving better latency for time-critical traffic (because label switching happens in hardware) and enabling VPN and Class of Service capability — effectively making the connectionless IP network behave in a connection-orientated way.",
    reference: "Back to Basics: Telecoms Part 1 — \"Multi-Protocol Label Switching (MPLS)\""
  },
  {
    id: "tc_p1_14",
    topic: "Electrification interference",
    q: "According to the ITU limits referenced in the article, what is the maximum voltage the article gives as permitted to be induced in telecoms copper cables under normal (non-fault) conditions?",
    options: [
      "25V RMS",
      "60V RMS",
      "230V RMS",
      "430V RMS"
    ],
    correct: 1,
    explanation: "The ITU limit quoted is 60V RMS under normal conditions, rising to 430V RMS under system fault conditions — the 430V figure is the fault-condition limit, not the normal-condition one, making it a common point of confusion.",
    reference: "Back to Basics: Telecoms Part 1 — \"Electrification, interference and immunisation\""
  },
  {
    id: "tc_p2_01",
    topic: "Public address (PA)",
    q: "Which of the following is one of the four key requirements of a good PA system described in the article?",
    options: [
      "Maximum possible loudness at all times, regardless of the surrounding environment",
      "Intelligibility — described as one of the most important requirements, and an area where many systems fall short",
      "Exclusive use of live announcements, with pre-recorded messages never permitted",
      "A single fixed volume setting that never adjusts to background noise"
    ],
    correct: 1,
    explanation: "The four requirements are loudness (at an appropriate level, not simply maximum), intelligibility, naturalness (pre-recorded announcements sounding like live ones), and reliability. Intelligibility is specifically flagged as an area many systems get wrong.",
    reference: "Back to Basics: Telecoms Part 2 — \"Public Address (PA)\""
  },
  {
    id: "tc_p2_02",
    topic: "CCTV specification",
    q: "In CCTV camera specification, what does an \"IP65\" rating describe, and how does this differ from other uses of \"IP\" in telecoms?",
    options: [
      "It refers to Internet Protocol version 65 and is unrelated to the camera housing",
      "It is an Ingress Protection rating describing resistance to solid objects and water — a different meaning of \"IP\" from Internet Protocol",
      "It refers to the camera's internal processor clock speed",
      "It refers to the image resolution of the camera in pixels"
    ],
    correct: 1,
    explanation: "Ingress Protection (IP) ratings describe how well an enclosure resists solid objects and water — cameras are typically specified at IP34 internally and IP65 externally. This is a different use of the letters \"IP\" from Internet Protocol, and the article specifically flags the potential confusion.",
    reference: "Back to Basics: Telecoms Part 2 — \"Cameras\""
  },
  {
    id: "tc_p2_03",
    topic: "CCTV storage",
    q: "What retention period does the article give as typical for CCTV recordings before automatic deletion, unless footage is marked for retention?",
    options: [
      "24 hours",
      "7 days",
      "31 days",
      "12 months"
    ],
    correct: 2,
    explanation: "Recordings are typically kept for around 31 days to support post-incident investigation, after which they're automatically deleted unless specifically marked for retention.",
    reference: "Back to Basics: Telecoms Part 2 — \"Video storage\""
  },
  {
    id: "tc_p2_04",
    topic: "Train connectivity",
    q: "What is the function of a Digital On-Board Repeater (D-OBR) on a train?",
    options: [
      "It provides a dedicated satellite uplink for passenger Wi-Fi",
      "It amplifies and re-radiates external mobile operator signals inside the train via ceiling-mounted antennas, giving devices without Wi-Fi a usable signal",
      "It converts the GSM-R signal into a public Wi-Fi hotspot",
      "It stores CCTV footage locally until the train reaches a station with connectivity"
    ],
    correct: 1,
    explanation: "A D-OBR is an active multi-band repeater that picks up external 2G/3G/4G mobile signals and re-radiates them inside the train, improving reception for passengers' own mobile phones even without a Wi-Fi service present.",
    reference: "Back to Basics: Telecoms Part 2 — \"Internet connection for trains\""
  },
  {
    id: "tc2_01",
    topic: "Lineside telephones",
    q: "When a user lifts a lineside telephone handset to place a call, what electrical event on the line does the far end detect?",

    explanation: "Although the terms trap points and catch points are often used interchangeably, historically catch points were provided on steep inclines in the days of unbraked vehicles: if a train split in two while climbing, the back portion would run back down the gradient, and the catch points would derail it to avoid collision with another train. Catch points were generally not worked by the signalman or interlocking — the switch blades were moved by the wheels of the ascending train and returned to the derail position afterwards, so they were only installed on uni-directional lines.",
    reference: "Back to Basics: Points, Part Two — \"Points for avoiding collisions\""
  }
];
PTS_QUESTIONS.forEach(q => { q.category = "Points"; });

// Combine all topic batches into one master list. To add a new topic batch
// later, define its array the same way as TELECOMS_QUESTIONS above, tag it
// with a category, then add it to the list below.
const QUESTIONS = [
  ...TELECOMS_QUESTIONS,
  ...INTRO_QUESTIONS,
  ...REQS_QUESTIONS,
  ...DETECTION_QUESTIONS,
  ...INTERLOCKING_QUESTIONS,
  ...SAFETY_QUESTIONS,
  ...TRAINPROT_QUESTIONS,
  ...OPINTERFACE_QUESTIONS,
  ...SAFETYENG_QUESTIONS,
  ...METRO_QUESTIONS,
  ...LEVELX_QUESTIONS,
  ...SYSMGMT_QUESTIONS,
  ...INTERFACES_QUESTIONS,
  ...MAINTENANCE_QUESTIONS,
  ...SILEXPLAINED_QUESTIONS,
  ...MTC_QUESTIONS,
  ...SIG_QUESTIONS,
  ...STL_QUESTIONS,
  ...ETCS_QUESTIONS,
  ...DEP_QUESTIONS,
  ...PTS_QUESTIONS
];



// ---------- STATE / PERSISTENCE ----------
const STORAGE_KEY = "irse-moduleA-progress-v1";
const FILTER_KEY = "irse-moduleA-filter-v1";

// Virtual "topic" that isn't a real category — it's a live filter over
// bookmarked questions and questions ever answered incorrectly.
const REVISIT_CATEGORY = "\u2605 To be revisited";

// Light Leitner-style spaced repetition: box 0 = just missed / brand new,
// each correct answer promotes to the next box (longer gap before it's due
// again), any incorrect answer drops straight back to box 0.
const SRS_INTERVALS_MS = [
  0,                      // box 0: due immediately (new / just got it wrong)
  1 * 24 * 60 * 60 * 1000,  // box 1: 1 day
  3 * 24 * 60 * 60 * 1000,  // box 2: 3 days
  7 * 24 * 60 * 60 * 1000,  // box 3: 1 week
  16 * 24 * 60 * 60 * 1000, // box 4: 16 days
  35 * 24 * 60 * 60 * 1000  // box 5: 35 days (mastered, still resurfaces eventually)
];

function freshProgress(){
  return { wrong:0, seen:0, box:0, nextDue:0, bookmarked:false, lastResult:null };
}

function allCategories(){
  return [...new Set(QUESTIONS.map(q => q.category))];
}
// Real topics plus the virtual "to be revisited" filter, for the Topics panel.
function filterableCategories(){
  return [...allCategories(), REVISIT_CATEGORY];
}
function needsRevisit(q){
  const p = progress[q.id];
  return !!p && (p.bookmarked || p.wrong > 0);
}
function loadFilter(){
  try{
    const raw = localStorage.getItem(FILTER_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      const validSet = new Set(filterableCategories());
      const valid = arr.filter(c => validSet.has(c));
      if(valid.length) return new Set(valid);
    }
  }catch(e){}
  return new Set(allCategories()); // default: every real topic selected, revisit off
}
function saveFilter(set){
  try{ localStorage.setItem(FILTER_KEY, JSON.stringify([...set])); }catch(e){}
}
function filteredQuestions(){
  return QUESTIONS.filter(q => {
    if(selectedCategories.has(q.category)) return true;
    if(selectedCategories.has(REVISIT_CATEGORY) && needsRevisit(q)) return true;
    return false;
  });
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const fresh = {};
  QUESTIONS.forEach(q => fresh[q.id] = freshProgress());
  return fresh;
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}

let progress = loadProgress();
QUESTIONS.forEach(q => {
  if(!progress[q.id]){
    progress[q.id] = freshProgress();
  } else {
    // Migrate any progress saved by an older version of this app.
    const p = progress[q.id];
    if(p.box === undefined) p.box = 0;
    if(p.nextDue === undefined) p.nextDue = p.seen > 0 ? 0 : 0;
    if(p.bookmarked === undefined) p.bookmarked = false;
    if(p.lastResult === undefined) p.lastResult = null;
  }
});

let sessionCorrect = 0;
let sessionSeen = 0;
let queue = [];
let currentQ = null;
let answered = false;
let showingMissed = false;
let showingFilter = false;
let showingStats = false;
let showingBookmarks = false;
let selectedSet = new Set();
let selectedCategories = loadFilter();
let lastSelectedIdx = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// A question is "due" once its scheduled review time has passed. Never
// counts brand-new (unseen) questions.
function isDue(q){
  const p = progress[q.id];
  return !!p && p.seen > 0 && p.nextDue <= Date.now();
}
function dueForReview(){
  return filteredQuestions().filter(isDue);
}
function bookmarkedQuestions(){
  return QUESTIONS.filter(q => progress[q.id] && progress[q.id].bookmarked);
}
function coverageCount(){
  return QUESTIONS.filter(q => progress[q.id] && progress[q.id].seen > 0).length;
}
function topicStats(){
  return allCategories().map(cat => {
    const qs = QUESTIONS.filter(q => q.category === cat);
    let attempted = 0, seenTotal = 0, wrongTotal = 0;
    qs.forEach(q => {
      const p = progress[q.id];
      if(p && p.seen > 0){
        attempted++;
        seenTotal += p.seen;
        wrongTotal += p.wrong;
      }
    });
    const accuracy = seenTotal > 0 ? Math.round(((seenTotal - wrongTotal) / seenTotal) * 100) : null;
    return { cat, attempted, total: qs.length, accuracy };
  });
}

// Returns a copy of the question with its options in a random order, so the
// correct answer isn't always in the same position. Works for both single
// (correct: number) and multi (correct: array) formats.
function withShuffledOptions(q){
  const order = shuffle(q.options.map((_, i) => i)); // random permutation of original indices
  const newOptions = order.map(origIdx => q.options[origIdx]);
  let newCorrect;
  if(Array.isArray(q.correct)){
    newCorrect = order
      .map((origIdx, newIdx) => q.correct.includes(origIdx) ? newIdx : -1)
      .filter(x => x !== -1);
  } else {
    newCorrect = order.indexOf(q.correct);
  }
  return Object.assign({}, q, { options: newOptions, correct: newCorrect });
}

function buildQueue(){
  const pool = filteredQuestions();
  const main = shuffle(pool.map(q=>q.id));
  const due = shuffle(dueForReview().map(q=>q.id));
  const merged = [];
  let dueIdx = 0;
  main.forEach((id, i) => {
    merged.push(id);
    if((i+1) % 3 === 0 && dueIdx < due.length){
      merged.push(due[dueIdx]);
      dueIdx++;
    }
  });
  while(dueIdx < due.length){ merged.push(due[dueIdx]); dueIdx++; }
  return merged;
}

function nextQuestion(){
  if(filteredQuestions().length === 0){
    currentQ = null;
    answered = false;
    selectedSet = new Set();
    lastSelectedIdx = null;
    render();
    return;
  }
  if(queue.length === 0) queue = buildQueue();
  const id = queue.shift();
  currentQ = withShuffledOptions(QUESTIONS.find(q => q.id === id));
  answered = false;
  selectedSet = new Set();
  lastSelectedIdx = null;
  sessionSeen++;
  render();
}

function recordAnswer(isCorrect){
  const p = progress[currentQ.id];
  p.seen++;
  p.lastResult = isCorrect ? 'correct' : 'incorrect';
  if(isCorrect){
    sessionCorrect++;
    p.box = Math.min((p.box || 0) + 1, SRS_INTERVALS_MS.length - 1);
  } else {
    p.wrong++;
    p.box = 0;
  }
  p.nextDue = Date.now() + SRS_INTERVALS_MS[p.box];
  progress[currentQ.id] = p;
  saveProgress(progress);
  answered = true;
}

function selectOption(idx){
  if(answered) return;
  lastSelectedIdx = idx;
  const isCorrect = idx === currentQ.correct;
  recordAnswer(isCorrect);
  render(idx);
}

// Bookmarking is independent of correct/incorrect and works both before and
// after the question has been answered.
function toggleBookmark(){
  if(!currentQ) return;
  const p = progress[currentQ.id];
  p.bookmarked = !p.bookmarked;
  progress[currentQ.id] = p;
  saveProgress(progress);
  render(lastSelectedIdx);
}

function toggleOption(idx){
  if(answered) return;
  if(selectedSet.has(idx)){
    selectedSet.delete(idx);
  } else if(selectedSet.size < currentQ.selectCount){
    selectedSet.add(idx);
  }
  render();
}

function submitMulti(){
  if(answered) return;
  if(selectedSet.size !== currentQ.selectCount) return;
  const isCorrect = currentQ.correct.length === selectedSet.size &&
    currentQ.correct.every(x => selectedSet.has(x));
  recordAnswer(isCorrect);
  render();
}

function resetProgress(){
  if(!confirm('Reset all progress, including bookmarks and topic stats? This cannot be undone.')) return;
  progress = {};
  QUESTIONS.forEach(q => progress[q.id] = freshProgress());
  saveProgress(progress);
  sessionCorrect = 0;
  sessionSeen = 0;
  queue = [];
  showingMissed = false;
  showingStats = false;
  showingBookmarks = false;
  lastSelectedIdx = null;
  nextQuestion();
}

function toggleStatsPanel(){
  showingStats = !showingStats;
  render(lastSelectedIdx);
}

function toggleBookmarksPanel(){
  showingBookmarks = !showingBookmarks;
  render(lastSelectedIdx);
}

function toggleMissed(){
  showingMissed = !showingMissed;
  render(lastSelectedIdx);
}

function applyFilterChange(){
  saveFilter(selectedCategories);
  queue = [];
  sessionCorrect = 0;
  sessionSeen = 0;
  nextQuestion();
}

function toggleCategory(cat){
  if(selectedCategories.has(cat)) selectedCategories.delete(cat);
  else selectedCategories.add(cat);
  applyFilterChange();
}

function selectAllCategories(){
  selectedCategories = new Set(filterableCategories());
  applyFilterChange();
}

function clearAllCategories(){
  selectedCategories = new Set();
  applyFilterChange();
}

function toggleFilterPanel(){
  showingFilter = !showingFilter;
  render(lastSelectedIdx);
}

// ---------- RENDER ----------
function render(selectedIdx = lastSelectedIdx){
  const app = document.getElementById('app');
  const due = dueForReview();
  const isReviewQ = currentQ && isDue(currentQ);
  const isBookmarked = currentQ && !!progress[currentQ.id].bookmarked;
  const fmt = currentQ && currentQ.format === 'multi' ? 'multi' : 'single';

  let optionsHtml = '';
  let submitHtml = '';
  let correctNow = false;

  if(currentQ && fmt === 'single'){
    optionsHtml = currentQ.options.map((opt, i) => {
      let cls = 'option';
      let disabled = '';
      if(answered){
        disabled = 'disabled';
        if(i === currentQ.correct) cls += ' correct';
        else if(i === selectedIdx) cls += ' incorrect';
        else cls += ' dim';
      }
      const letter = String.fromCharCode(65+i);
      return `<button class="${cls}" ${disabled} onclick="selectOption(${i})">
        <span class="letter">${letter}</span><span>${opt}</span>
      </button>`;
    }).join('');
    correctNow = selectedIdx === currentQ.correct;
  } else if(currentQ && fmt === 'multi'){
    optionsHtml = currentQ.options.map((opt, i) => {
      let cls = 'option';
      let disabled = '';
      const isSelected = selectedSet.has(i);
      const isCorrectOpt = currentQ.correct.includes(i);
      if(answered){
        disabled = 'disabled';
        if(isSelected && isCorrectOpt) cls += ' correct';
        else if(isSelected && !isCorrectOpt) cls += ' incorrect';
        else if(!isSelected && isCorrectOpt) cls += ' missed';
        else cls += ' dim';
      } else if(isSelected){
        cls += ' selected';
      }
      const letter = String.fromCharCode(65+i);
      return `<button class="${cls}" ${disabled} onclick="toggleOption(${i})">
        <span class="letter">${letter}</span><span>${opt}</span>
      </button>`;
    }).join('');
    if(!answered){
      const canSubmit = selectedSet.size === currentQ.selectCount;
      submitHtml = `<button class="next-btn submit-btn" ${canSubmit ? '' : 'disabled'} onclick="submitMulti()">Check answer (${selectedSet.size}/${currentQ.selectCount} selected)</button>`;
    }
    correctNow = currentQ.correct.length === selectedSet.size && currentQ.correct.every(x => selectedSet.has(x));
  }

  let feedbackHtml = '';
  if(answered){
    feedbackHtml = `
      <div class="feedback ${correctNow ? 'ok' : 'no'}">
        <div class="verdict">${correctNow ? 'Correct' : 'Incorrect'}</div>
        <div class="explanation">${currentQ.explanation}</div>
        <div class="reference">${currentQ.reference}</div>
      </div>
      <button class="next-btn" onclick="nextQuestion()">Next question</button>
    `;
  }

  let missedPanelHtml = '';
  if(showingMissed){
    if(due.length === 0){
      missedPanelHtml = `<div class="missed-panel"><h3>Questions due for review</h3><div class="empty-note">Nothing in the review queue right now.</div></div>`;
    } else {
      const items = due.map(q => `
        <div class="missed-item">
          <span>${q.category} — ${q.topic}: ${q.q}</span>
          <span class="wc">×${progress[q.id].wrong}</span>
        </div>
      `).join('');
      missedPanelHtml = `<div class="missed-panel"><h3>Questions due for review (${due.length})</h3>${items}</div>`;
    }
  }

  const bookmarks = bookmarkedQuestions();
  let bookmarksPanelHtml = '';
  if(showingBookmarks){
    if(bookmarks.length === 0){
      bookmarksPanelHtml = `<div class="missed-panel"><h3>Bookmarked questions</h3><div class="empty-note">No bookmarks yet — tap the star on a question to save it here.</div></div>`;
    } else {
      const items = bookmarks.map(q => `
        <div class="missed-item"><span>${q.category} — ${q.topic}: ${q.q}</span></div>
      `).join('');
      bookmarksPanelHtml = `<div class="missed-panel"><h3>Bookmarked questions (${bookmarks.length})</h3>${items}</div>`;
    }
  }

  let statsPanelHtml = '';
  if(showingStats){
    const sorted = topicStats().slice().sort((a, b) => {
      if(a.accuracy === null && b.accuracy === null) return 0;
      if(a.accuracy === null) return 1;
      if(b.accuracy === null) return -1;
      return a.accuracy - b.accuracy;
    });
    const weakest = sorted.filter(s => s.accuracy !== null && s.accuracy < 70).slice(0, 3);
    const covCount = coverageCount();
    const covPct = QUESTIONS.length ? Math.round((covCount / QUESTIONS.length) * 100) : 0;
    const rows = sorted.map(s => {
      let tier = 'unattempted';
      let label = 'Not started';
      if(s.accuracy !== null){
        label = s.accuracy + '% correct';
        tier = s.accuracy < 70 ? 'weak' : (s.accuracy < 90 ? 'mid' : 'strong');
      }
      return `<div class="stats-row ${tier}">
        <div class="stats-row-top">
          <span class="cat-name">${s.cat}</span>
          <span class="cat-count">${s.attempted}/${s.total} attempted</span>
        </div>
        <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${s.accuracy ?? 0}%"></div></div>
        <div class="acc-label ${tier}">${label}</div>
      </div>`;
    }).join('');
    const weakestLine = weakest.length
      ? `<div class="empty-note" style="margin-bottom:10px;">Weakest so far: ${weakest.map(w => `${w.cat} (${w.accuracy}%)`).join(', ')}</div>`
      : '';
    statsPanelHtml = `<div class="missed-panel">
      <h3>Topic breakdown</h3>
      <div class="empty-note" style="margin-bottom:10px;">Coverage: ${covCount}/${QUESTIONS.length} questions seen overall (${covPct}%)</div>
      ${weakestLine}
      ${rows}
    </div>`;
  }

  const cats = filterableCategories();
  let filterPanelHtml = '';
  if(showingFilter){
    const rows = cats.map(cat => {
      const isRevisit = cat === REVISIT_CATEGORY;
      const count = isRevisit ? QUESTIONS.filter(needsRevisit).length : QUESTIONS.filter(q => q.category === cat).length;
      const checked = selectedCategories.has(cat) ? 'checked' : '';
      const safeCat = cat.replace(/'/g, "\\'");
      return `<label class="filter-row ${isRevisit ? 'revisit-row' : ''}">
        <input type="checkbox" ${checked} onchange="toggleCategory('${safeCat}')">
        <span class="filter-label">${cat}</span>
        <span class="filter-count">${count}</span>
      </label>`;
    }).join('');
    filterPanelHtml = `<div class="missed-panel">
      <h3>Topics to practise</h3>
      ${rows}
      <div class="filter-actions">
        <button class="link-btn" onclick="selectAllCategories()">Select all</button>
        <button class="link-btn" onclick="clearAllCategories()">Clear all</button>
      </div>
    </div>`;
  }

  const pool = filteredQuestions();
  const realCats = allCategories();
  const selectedList = [...selectedCategories];
  const selectedRealTopics = selectedList.filter(c => c !== REVISIT_CATEGORY);
  const revisitOn = selectedCategories.has(REVISIT_CATEGORY);
  let statusText;
  if(selectedList.length === 0){
    statusText = "No topics selected — open Topics below and choose at least one to start practising.";
  } else if(selectedRealTopics.length === realCats.length && !revisitOn){
    statusText = `Practising all topics — ${pool.length} questions in the mix.`;
  } else {
    const parts = [];
    if(selectedRealTopics.length) parts.push(selectedRealTopics.join(', '));
    if(revisitOn) parts.push(REVISIT_CATEGORY);
    statusText = `Practising: ${parts.join(', ')} — ${pool.length} questions in the mix.`;
  }

  app.innerHTML = `
    <header>
      <div class="title">Module A Revision<small>Practice quiz</small></div>
      <div class="stats">
        <div class="stat">
          <div class="n">${sessionCorrect}/${sessionSeen}</div>
          <div class="l">this session</div>
        </div>
        <div class="stat due">
          <div class="n">${due.length}</div>
          <div class="l">due for review</div>
        </div>
        <div class="stat">
          <div class="n">${coverageCount()}/${QUESTIONS.length}</div>
          <div class="l">seen overall</div>
        </div>
      </div>
    </header>

    <div class="demo-note">${statusText}</div>

    ${filterPanelHtml}

    ${statsPanelHtml}

    ${missedPanelHtml}

    ${bookmarksPanelHtml}

    ${currentQ ? `
    <div class="card ${isReviewQ ? 'review-tag' : ''}">
      <div class="q-meta">
        <span>${currentQ.category} — ${currentQ.topic}</span>
        <span style="display:flex; gap:10px; align-items:center;">
          ${fmt === 'multi' ? `<span class="badge" style="color:var(--accent);">select ${currentQ.selectCount}</span>` : ''}
          ${isReviewQ ? '<span class="badge">due for review</span>' : ''}
          <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark()" title="${isBookmarked ? 'Remove bookmark' : 'Bookmark this question'}">${isBookmarked ? '\u2605' : '\u2606'}</button>
        </span>
      </div>
      <div class="q-text">${currentQ.q}</div>
    </div>
    <div class="options">${optionsHtml}</div>
    ${submitHtml}
    ${feedbackHtml}
    ` : `
    <div class="card">
      <div class="q-text">No questions to show for the current topic selection. Open Topics below and pick at least one to begin.</div>
    </div>
    `}

    <div class="footer-row">
      <button class="link-btn" onclick="toggleFilterPanel()">${showingFilter ? 'Hide topics' : 'Topics'}</button>
      <button class="link-btn" onclick="toggleStatsPanel()">${showingStats ? 'Hide stats' : 'Stats'}</button>
      <button class="link-btn" onclick="toggleMissed()">${showingMissed ? 'Hide review list' : `Due for review (${due.length})`}</button>
      <button class="link-btn" onclick="toggleBookmarksPanel()">${showingBookmarks ? 'Hide bookmarks' : `Bookmarks (${bookmarks.length})`}</button>
      <button class="link-btn" onclick="resetProgress()">Reset progress</button>
    </div>
  `;
}

nextQuestion();
</script>
</body>
</html>
