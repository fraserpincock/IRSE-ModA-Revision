<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Module A Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700&family=Overpass+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1013;
    --panel:#161B1F;
    --panel-raised:#1C2227;
    --border:#262D33;
    --text:#EDEFEF;
    --muted:#8A939B;
    --accent:#4FA69E;
    --accent-hover:#5FBDB4;
    --correct:#3E9463;
    --correct-bg:rgba(62,148,99,0.14);
    --incorrect:#C1483B;
    --incorrect-bg:rgba(193,72,59,0.14);
    --review:#C98A2C;
    --review-bg:rgba(201,138,44,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Source Sans 3', -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:16px 16px 28px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  .title{
    font-family:'Overpass', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.01em;
  }
  .title small{
    display:block;
    font-family:'Source Sans 3', sans-serif;
    font-weight:400;
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
  }
  .stats{
    display:flex;
    gap:14px;
  }
  .stat{
    text-align:right;
  }
  .stat .n{
    font-family:'Overpass Mono', monospace;
    font-size:17px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .stat .l{
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
  }
  .stat.due .n{ color:var(--review); }

  .progress-track{
    height:3px;
    background:var(--border);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width 0.4s ease;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px 18px;
    margin-bottom:16px;
  }
  .card.review-tag{
    border-left:3px solid var(--review);
  }
  .q-meta{
    font-family:'Overpass Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
  }
  .q-meta .badge{
    color:var(--review);
  }
  .q-text{
    font-size:16.5px;
    line-height:1.5;
    font-weight:500;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .option{
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:6px;
    padding:13px 14px;
    display:flex;
    gap:11px;
    align-items:flex-start;
    text-align:left;
    font-family:inherit;
    font-size:14.5px;
    color:var(--text);
    cursor:pointer;
    line-height:1.4;
    transition:border-color 0.15s, background 0.15s;
  }
  .option:hover:not(:disabled){
    border-color:var(--accent);
  }
  .option:disabled{
    cursor:default;
  }
  .option .letter{
    font-family:'Overpass Mono', monospace;
    font-weight:600;
    color:var(--muted);
    flex-shrink:0;
  }
  .option.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
  }
  .option.correct .letter{ color:var(--correct); }
  .option.incorrect{
    border-color:var(--incorrect);
    background:var(--incorrect-bg);
  }
  .option.incorrect .letter{ color:var(--incorrect); }
  .option.dim{
    opacity:0.45;
  }
  .option.selected{
    border-color:var(--accent);
    background:rgba(79,166,158,0.14);
  }
  .option.missed{
    border-color:var(--review);
    background:var(--review-bg);
  }
  .option.missed .letter{ color:var(--review); }
  .submit-btn[disabled]{
    opacity:0.35;
    cursor:default;
  }

  .feedback{
    border-radius:6px;
    padding:15px 16px;
    margin-bottom:16px;
    border:1px solid var(--border);
    animation:rise 0.25s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .feedback.ok{ border-color:var(--correct); }
  .feedback.no{ border-color:var(--incorrect); }
  .verdict{
    font-family:'Overpass', sans-serif;
    font-weight:700;
    font-size:13px;
    margin-bottom:8px;
  }
  .feedback.ok .verdict{ color:var(--correct); }
  .feedback.no .verdict{ color:var(--incorrect); }
  .explanation{
    font-size:14px;
    line-height:1.55;
    color:var(--text);
    margin-bottom:10px;
  }
  .reference{
    font-family:'Overpass Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    padding-top:9px;
    border-top:1px solid var(--border);
  }

  .next-btn{
    background:var(--accent);
    color:#0D1013;
    border:none;
    border-radius:6px;
    padding:14px;
    font-family:'Overpass', sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    width:100%;
  }
  .next-btn:hover{ background:var(--accent-hover); }

  .footer-row{
    margin-top:auto;
    padding-top:22px;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    align-items:center;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    font-family:'Source Sans 3', sans-serif;
    cursor:pointer;
    padding:6px 0;
  }
  .link-btn:hover{ color:var(--text); }

  .panel-toggle{
    display:none;
  }
  .missed-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:16px;
    margin-bottom:16px;
  }
  .missed-panel h3{
    font-family:'Overpass', sans-serif;
    font-size:13px;
    margin:0 0 12px;
    font-weight:700;
  }
  .missed-item{
    font-size:13px;
    padding:9px 0;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .missed-item:first-child{ border-top:none; }
  .missed-item .wc{
    font-family:'Overpass Mono', monospace;
    color:var(--review);
    flex-shrink:0;
    font-size:12px;
  }
  .empty-note{
    font-size:13px;
    color:var(--muted);
  }
  .demo-note{
    font-size:11.5px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:16px;
    padding:10px 12px;
    border:1px dashed var(--border);
    border-radius:6px;
  }
  .filter-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13.5px;
    padding:8px 0;
    border-top:1px solid var(--border);
    cursor:pointer;
  }
  .filter-row:first-of-type{ border-top:none; }
  .filter-row input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:var(--accent);
    flex-shrink:0;
  }
  .filter-row .filter-label{
    flex:1;
  }
  .filter-count{
    font-family:'Overpass Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .filter-actions{
    display:flex;
    gap:16px;
    padding-top:12px;
    margin-top:4px;
    border-top:1px solid var(--border);
  }
</style>
</head>

// Combine all topic batches into one master list. To add a new topic batch
// later, define its array the same way as TELECOMS_QUESTIONS above, tag it
// with a category, then add it to the list below, e.g.:
//   const INTERLOCKING_QUESTIONS = [ ... ];
//   INTERLOCKING_QUESTIONS.forEach(q => { q.category = "Interlocking"; });
//   const QUESTIONS = [ ...TELECOMS_QUESTIONS, ...INTERLOCKING_QUESTIONS ];
const QUESTIONS = [
  ...TELECOMS_QUESTIONS
];

// ---------- STATE / PERSISTENCE ----------
const STORAGE_KEY = "irse-moduleA-progress-v1";
const FILTER_KEY = "irse-moduleA-filter-v1";

function allCategories(){
  return [...new Set(QUESTIONS.map(q => q.category))];
}
function loadFilter(){
  try{
    const raw = localStorage.getItem(FILTER_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      const valid = arr.filter(c => allCategories().includes(c));
      if(valid.length) return new Set(valid);
    }
  }catch(e){}
  return new Set(allCategories()); // default: everything selected
}
function saveFilter(set){
  try{ localStorage.setItem(FILTER_KEY, JSON.stringify([...set])); }catch(e){}
}
function filteredQuestions(){
  return QUESTIONS.filter(q => selectedCategories.has(q.category));
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const fresh = {};
  QUESTIONS.forEach(q => fresh[q.id] = { wrong:0, correctStreak:0, seen:0 });
  return fresh;
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}

let progress = loadProgress();
QUESTIONS.forEach(q => { if(!progress[q.id]) progress[q.id] = { wrong:0, correctStreak:0, seen:0 }; });

let sessionCorrect = 0;
let sessionSeen = 0;
let queue = [];
let currentQ = null;
let answered = false;
let showingMissed = false;
let showingFilter = false;
let selectedSet = new Set();
let selectedCategories = loadFilter();

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function dueForReview(){
  return filteredQuestions().filter(q => progress[q.id].wrong > 0 && progress[q.id].correctStreak < 2);
}

function buildQueue(){
  const pool = filteredQuestions();
  const main = shuffle(pool.map(q=>q.id));
  const due = shuffle(dueForReview().map(q=>q.id));
  const merged = [];
  let dueIdx = 0;
  main.forEach((id, i) => {
    merged.push(id);
    if((i+1) % 3 === 0 && dueIdx < due.length){
      merged.push(due[dueIdx]);
      dueIdx++;
    }
  });
  while(dueIdx < due.length){ merged.push(due[dueIdx]); dueIdx++; }
  return merged;
}

function nextQuestion(){
  if(filteredQuestions().length === 0){
    currentQ = null;
    answered = false;
    selectedSet = new Set();
    render();
    return;
  }
  if(queue.length === 0) queue = buildQueue();
  const id = queue.shift();
  currentQ = QUESTIONS.find(q => q.id === id);
  answered = false;
  selectedSet = new Set();
  sessionSeen++;
  render();
}

function recordAnswer(isCorrect){
  const p = progress[currentQ.id];
  p.seen++;
  if(isCorrect){
    sessionCorrect++;
    p.correctStreak++;
  } else {
    p.wrong++;
    p.correctStreak = 0;
  }
  progress[currentQ.id] = p;
  saveProgress(progress);
  answered = true;
}

function selectOption(idx){
  if(answered) return;
  const isCorrect = idx === currentQ.correct;
  recordAnswer(isCorrect);
  render(idx);
}

function toggleOption(idx){
  if(answered) return;
  if(selectedSet.has(idx)){
    selectedSet.delete(idx);
  } else if(selectedSet.size < currentQ.selectCount){
    selectedSet.add(idx);
  }
  render();
}

function submitMulti(){
  if(answered) return;
  if(selectedSet.size !== currentQ.selectCount) return;
  const isCorrect = currentQ.correct.length === selectedSet.size &&
    currentQ.correct.every(x => selectedSet.has(x));
  recordAnswer(isCorrect);
  render();
}

function resetProgress(){
  progress = {};
  QUESTIONS.forEach(q => progress[q.id] = { wrong:0, correctStreak:0, seen:0 });
  saveProgress(progress);
  sessionCorrect = 0;
  sessionSeen = 0;
  queue = [];
  showingMissed = false;
  nextQuestion();
}

function toggleMissed(){
  showingMissed = !showingMissed;
  render();
}

function applyFilterChange(){
  saveFilter(selectedCategories);
  queue = [];
  sessionCorrect = 0;
  sessionSeen = 0;
  nextQuestion();
}

function toggleCategory(cat){
  if(selectedCategories.has(cat)) selectedCategories.delete(cat);
  else selectedCategories.add(cat);
  applyFilterChange();
}

function selectAllCategories(){
  selectedCategories = new Set(allCategories());
  applyFilterChange();
}

function clearAllCategories(){
  selectedCategories = new Set();
  applyFilterChange();
}

function toggleFilterPanel(){
  showingFilter = !showingFilter;
  render();
}

// ---------- RENDER ----------
function render(selectedIdx){
  const app = document.getElementById('app');
  const due = dueForReview();
  const isReviewQ = currentQ && progress[currentQ.id].wrong > 0 && progress[currentQ.id].correctStreak < 2;
  const fmt = currentQ && currentQ.format === 'multi' ? 'multi' : 'single';

  let optionsHtml = '';
  let submitHtml = '';
  let correctNow = false;

  if(currentQ && fmt === 'single'){
    optionsHtml = currentQ.options.map((opt, i) => {
      let cls = 'option';
      let disabled = '';
      if(answered){
        disabled = 'disabled';
        if(i === currentQ.correct) cls += ' correct';
        else if(i === selectedIdx) cls += ' incorrect';
        else cls += ' dim';
      }
      const letter = String.fromCharCode(65+i);
      return `<button class="${cls}" ${disabled} onclick="selectOption(${i})">
        <span class="letter">${letter}</span><span>${opt}</span>
      </button>`;
    }).join('');
    correctNow = selectedIdx === currentQ.correct;
  } else if(currentQ && fmt === 'multi'){
    optionsHtml = currentQ.options.map((opt, i) => {
      let cls = 'option';
      let disabled = '';
      const isSelected = selectedSet.has(i);
      const isCorrectOpt = currentQ.correct.includes(i);
      if(answered){
        disabled = 'disabled';
        if(isSelected && isCorrectOpt) cls += ' correct';
        else if(isSelected && !isCorrectOpt) cls += ' incorrect';
        else if(!isSelected && isCorrectOpt) cls += ' missed';
        else cls += ' dim';
      } else if(isSelected){
        cls += ' selected';
      }
      const letter = String.fromCharCode(65+i);
      return `<button class="${cls}" ${disabled} onclick="toggleOption(${i})">
        <span class="letter">${letter}</span><span>${opt}</span>
      </button>`;
    }).join('');
    if(!answered){
      const canSubmit = selectedSet.size === currentQ.selectCount;
      submitHtml = `<button class="next-btn submit-btn" ${canSubmit ? '' : 'disabled'} onclick="submitMulti()">Check answer (${selectedSet.size}/${currentQ.selectCount} selected)</button>`;
    }
    correctNow = currentQ.correct.length === selectedSet.size && currentQ.correct.every(x => selectedSet.has(x));
  }

  let feedbackHtml = '';
  if(answered){
    feedbackHtml = `
      <div class="feedback ${correctNow ? 'ok' : 'no'}">
        <div class="verdict">${correctNow ? 'Correct' : 'Incorrect'}</div>
        <div class="explanation">${currentQ.explanation}</div>
        <div class="reference">${currentQ.reference}</div>
      </div>
      <button class="next-btn" onclick="nextQuestion()">Next question</button>
    `;
  }

  let missedPanelHtml = '';
  if(showingMissed){
    if(due.length === 0){
      missedPanelHtml = `<div class="missed-panel"><h3>Questions due for review</h3><div class="empty-note">Nothing in the review queue right now.</div></div>`;
    } else {
      const items = due.map(q => `
        <div class="missed-item">
          <span>${q.category} — ${q.topic}: ${q.q}</span>
          <span class="wc">×${progress[q.id].wrong}</span>
        </div>
      `).join('');
      missedPanelHtml = `<div class="missed-panel"><h3>Questions due for review (${due.length})</h3>${items}</div>`;
    }
  }

  const cats = allCategories();
  let filterPanelHtml = '';
  if(showingFilter){
    const rows = cats.map(cat => {
      const count = QUESTIONS.filter(q => q.category === cat).length;
      const checked = selectedCategories.has(cat) ? 'checked' : '';
      const safeCat = cat.replace(/'/g, "\\'");
      return `<label class="filter-row">
        <input type="checkbox" ${checked} onchange="toggleCategory('${safeCat}')">
        <span class="filter-label">${cat}</span>
        <span class="filter-count">${count}</span>
      </label>`;
    }).join('');
    filterPanelHtml = `<div class="missed-panel">
      <h3>Topics to practise</h3>
      ${rows}
      <div class="filter-actions">
        <button class="link-btn" onclick="selectAllCategories()">Select all</button>
        <button class="link-btn" onclick="clearAllCategories()">Clear all</button>
      </div>
    </div>`;
  }

  const pool = filteredQuestions();
  const selectedList = [...selectedCategories];
  let statusText;
  if(selectedList.length === 0){
    statusText = "No topics selected — open Topics below and choose at least one to start practising.";
  } else if(selectedList.length === cats.length){
    statusText = `Practising all topics — ${pool.length} questions in the mix.`;
  } else {
    statusText = `Practising: ${selectedList.join(', ')} — ${pool.length} questions in the mix.`;
  }

  app.innerHTML = `
    <header>
      <div class="title">Module A Revision<small>Practice quiz</small></div>
      <div class="stats">
        <div class="stat">
          <div class="n">${sessionCorrect}/${sessionSeen}</div>
          <div class="l">this session</div>
        </div>
        <div class="stat due">
          <div class="n">${due.length}</div>
          <div class="l">due for review</div>
        </div>
      </div>
    </header>

    <div class="demo-note">${statusText}</div>

    ${filterPanelHtml}

    ${missedPanelHtml}

    ${currentQ ? `
    <div class="card ${isReviewQ ? 'review-tag' : ''}">
      <div class="q-meta">
        <span>${currentQ.category} — ${currentQ.topic}</span>
        <span style="display:flex; gap:8px;">
          ${fmt === 'multi' ? `<span class="badge" style="color:var(--accent);">select ${currentQ.selectCount}</span>` : ''}
          ${isReviewQ ? '<span class="badge">due for review</span>' : ''}
        </span>
      </div>
      <div class="q-text">${currentQ.q}</div>
    </div>
    <div class="options">${optionsHtml}</div>
    ${submitHtml}
    ${feedbackHtml}
    ` : `
    <div class="card">
      <div class="q-text">No questions to show for the current topic selection. Open Topics below and pick at least one to begin.</div>
    </div>
    `}

    <div class="footer-row">
      <button class="link-btn" onclick="toggleFilterPanel()">${showingFilter ? 'Hide topics' : 'Topics'}</button>
      <button class="link-btn" onclick="toggleMissed()">${showingMissed ? 'Hide review list' : 'View review list'}</button>
      <button class="link-btn" onclick="resetProgress()">Reset progress</button>
    </div>
  `;
}

nextQuestion();
</script>
</body>
</html>
